[package]
name = "framescope-update"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
minisign-verify = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }

[dev-dependencies]
tempfile = "3"
