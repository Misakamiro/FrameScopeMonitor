[package]
name = "framescope-ui-preview"
version = "1.0.0"
description = "FrameScope - local game performance monitor"
edition = "2021"
license = "GPL-3.0"

[workspace]

[features]
uiaccess-acceptance = []

[lib]
name = "framescope_ui_preview"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.10", features = ["tray-icon", "protocol-asset", "devtools", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
log = "0.4"
chrono = "0.4"
sha2 = "0.10"
sysinfo = "0.30"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_GdiPlus",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Environment",
  "Win32_System_SystemInformation",
  "Win32_System_JobObjects",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_System_LibraryLoader"
] }

# PATCH(framescope): vendored tao - transparent windows use WS_EX_NOREDIRECTIONBITMAP
# instead of the legacy blur-behind that paints a permanent frost on Win11 24H2.
# See vendor/tao/src/platform_impl/windows/window.rs "PATCH(framescope)".
[patch.crates-io]
tao = { path = "vendor/tao" }
wry = { path = "vendor/wry" }
