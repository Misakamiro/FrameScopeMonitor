[package]
name = "framescope-installer"
version = "2.0.0"
description = "FrameScope Installer"
edition = "2021"

[lib]
name = "framescope_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
transaction-validation = []

[[bin]]
name = "transaction-validation"
path = "src/transaction_validation_main.rs"
required-features = ["transaction-validation"]

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"
dirs = "5"
zip = "2"
mslnk = "0.1"
sha2 = "0.10"
framescope-update = { path = "../../../src/updater" }
