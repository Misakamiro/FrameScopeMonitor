[package]
name = "fps-bench"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fps-bench"
path = "src/main.rs"

[dependencies]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level = 3
